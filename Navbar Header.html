<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vantage · Navbar Header</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:           #060607;
    --surface:      #121214;
    --surface-2:    #18181c;
    --rule:         rgba(255,255,255,0.06);
    --rule-2:       rgba(255,255,255,0.10);
    --ink:          #e8e8ea;
    --ink-dim:      #8a8f96;
    --ink-dimmer:   #555a62;
    --ink-faint:    #353940;
    --positive:     #00ff88;
    --positive-dim: #00cc6e;
    --negative:     #ff4444;
    --slate:        #94a3b8;
    --etrade-a:     #8b5cf6;
    --etrade-b:     #22d3ee;

    --font-headline: "Space Grotesk", sans-serif;
    --font-body:     "Inter", sans-serif;
    --font-mono:     "JetBrains Mono", monospace;

    --header-h: 68px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: var(--font-body);
    background:
      radial-gradient(ellipse 70% 60% at 50% -10%, rgba(0,255,136,0.05), transparent 55%),
      var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-weight: 400; font-style: normal; line-height: 1;
    display: inline-block;
    -webkit-font-feature-settings: 'liga';
    font-feature-settings: 'liga';
    user-select: none;
  }

  /* ─────────────────────────────  HEADER  ───────────────────────────── */
  .nav {
    position: relative;
    height: var(--header-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.018), transparent 70%),
      rgba(18,18,20,0.92);
    backdrop-filter: blur(10px) saturate(160%);
    -webkit-backdrop-filter: blur(10px) saturate(160%);
    border-bottom: 1px solid var(--rule);
    z-index: 50;
  }
  /* hairline accent + scanline texture */
  .nav::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,255,136,0.45), rgba(0,255,136,0.08) 60%, transparent);
    pointer-events: none;
  }
  .nav::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom,
      transparent 0, transparent 2px,
      rgba(255,255,255,0.012) 2px, rgba(255,255,255,0.012) 3px);
    pointer-events: none; opacity: 0.6;
  }

  .nav-left { display: flex; align-items: center; gap: 34px; min-width: 0; }

  /* brand */
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand-mark {
    position: relative; width: 9px; height: 9px; flex-shrink: 0;
  }
  .brand-mark .core {
    position: absolute; inset: 1.5px; border-radius: 50%;
    background: var(--positive);
    box-shadow: 0 0 10px var(--positive);
  }
  .brand-mark .ring {
    position: absolute; inset: -3px; border-radius: 50%;
    border: 1px solid rgba(0,255,136,0.35);
    animation: brand-ping 2.4s ease-out infinite;
  }
  @keyframes brand-ping {
    0%   { transform: scale(0.7); opacity: 0.9; }
    70%  { transform: scale(1.5); opacity: 0; }
    100% { opacity: 0; }
  }
  .brand-text { line-height: 1; }
  .brand-name {
    font-family: var(--font-headline);
    font-weight: 700; font-size: 21px; letter-spacing: -0.02em;
    color: #fff; margin: 0;
  }
  .brand-sub {
    font-family: var(--font-mono); font-size: 9px; font-weight: 500;
    letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--ink-dimmer); margin-top: 3px;
  }

  /* nav tabs */
  .tabs { display: flex; align-items: stretch; height: var(--header-h); }
  .tab {
    position: relative;
    --tab-accent: var(--positive);
    --tab-glow: rgba(0,255,136,0.6);
    display: flex; align-items: center; gap: 8px;
    padding: 0 16px; height: 100%;
    text-decoration: none;
    color: var(--ink-dim);
    transition: color .16s ease;
  }
  .tab[data-accent="blue"]   { --tab-accent: #2f8fe6; --tab-glow: rgba(47,143,230,0.6); }
  .tab[data-accent="orange"] { --tab-accent: #ff8a3d; --tab-glow: rgba(255,138,61,0.6); }
  .tab .material-symbols-outlined { font-size: 19px; }
  .tab-label {
    font-family: var(--font-body); font-size: 13px; font-weight: 500;
    letter-spacing: 0.005em;
  }
  .tab::after {
    content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px;
    background: var(--tab-accent); border-radius: 2px 2px 0 0;
    box-shadow: 0 0 10px var(--tab-glow);
    transform: scaleX(0); transform-origin: center;
    transition: transform .2s ease;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: #fff; }
  .tab.active .tab-label { font-weight: 600; }
  .tab.active .material-symbols-outlined {
    font-variation-settings: 'FILL' 1;
    color: var(--tab-accent);
  }
  .tab.active::after { transform: scaleX(1); }
  /* brain icon stays outline-only even when active */
  .tab[data-accent="orange"].active .material-symbols-outlined {
    font-variation-settings: 'FILL' 0;
  }

  /* ─── center: portfolio value ─── */
  .ticker {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 0 8px;
  }
  .ticker-val {
    font-family: var(--font-headline);
    font-weight: 700; font-size: 19px; letter-spacing: -0.01em;
    color: #fff; line-height: 1; font-variant-numeric: tabular-nums;
  }
  .ticker-delta {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  }
  .ticker-delta .pct { font-size: 11px; font-weight: 700; color: var(--negative); }
  .ticker-delta .abs { font-size: 10px; color: rgba(255,68,68,0.7); }
  .ticker-delta .arr { font-size: 9px; color: var(--negative); transform: translateY(0.5px); }

  /* ─────────────────────────  RIGHT STATUS RAIL  ───────────────────────── */
  .rail {
    display: flex; align-items: stretch; gap: 0;
    height: var(--header-h); padding: 0;
    margin-right: -22px;
    border: none;
    border-left: 1px solid var(--rule-2);
    border-radius: 0;
    overflow: hidden;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.02), transparent 60%),
      rgba(0,0,0,0.35);
    box-shadow: inset 1px 0 0 rgba(255,255,255,0.04);
  }
  .rail-seg { display: flex; align-items: center; position: relative;
    border-left: 1px solid var(--rule); }
  .rail-seg:first-child { border-left: none; }

  /* market status */
  .mkt { flex-direction: column; align-items: flex-start; gap: 3px; padding: 0 14px; justify-content: center;
    background: rgba(255,255,255,0.00); }
  .mkt-top { display: flex; align-items: center; gap: 7px; }
  .mkt-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--positive); box-shadow: 0 0 8px var(--positive);
    animation: pulse-dot 1.8s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.45; transform: scale(0.7); }
  }
  .mkt-state {
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.18em; color: #fff; text-transform: uppercase;
  }
  .mkt-time {
    font-family: var(--font-mono); font-size: 10px; color: var(--ink-dim);
    font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  }

  /* agent sweep button */
  .agent-cell { padding: 0; align-self: stretch; align-items: stretch; background: #000; }
  .agent-btn {
    width: 100%; height: 100%; align-self: stretch;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 0;
    background: #000;
    border: none;
    color: var(--positive);
    cursor: pointer;
    transition: all .18s ease;
  }
  .agent-btn .material-symbols-outlined { font-size: 18px; transition: transform .18s ease; }
  .agent-btn:hover {
    background: #050505;
    box-shadow: inset 0 0 16px -6px rgba(0,255,136,0.5);
  }
  .agent-btn:hover .material-symbols-outlined { transform: scale(1.12); }

  /* broker */
  .broker {
    gap: 9px; padding: 0 14px; cursor: pointer;
    background: rgba(255,255,255,0.05);
    transition: filter .18s ease;
  }
  .broker:hover { filter: brightness(1.2); }
  .broker-logo {
    width: 22px; height: 22px; border-radius: 5px;
    background: linear-gradient(135deg, var(--etrade-a), #6d28d9 70%);
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; flex-shrink: 0;
    box-shadow: 0 2px 8px -3px rgba(139,92,246,0.7), inset 0 0 0 1px rgba(255,255,255,0.12);
  }
  .broker-logo .material-symbols-outlined { font-size: 14px; }
  .broker-label {
    font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    letter-spacing: 0.02em;
    background: linear-gradient(90deg, var(--etrade-a), var(--etrade-b));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ─── orbital settings / account button (preserved & refined) ─── */
  .orbit-btn {
    position: relative;
    width: 52px; align-self: stretch;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--rule); margin-left: -1px;
    cursor: pointer;
    transition: background .18s ease;
  }
  .orbit-btn:hover { background: rgba(255,255,255,0.12); }
  .orbit-stage {
    position: relative; width: 32px; height: 32px;
  }
  .orbit-ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.14);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .orbit-btn:hover .orbit-ring {
    border-color: rgba(255,255,255,0.22);
  }
  .orbit-ring::after { display: none; }

  /* the orbiting glyphs — spin only on hover */
  .orbit {
    position: absolute; left: 50%; top: 50%; width: 0; height: 0;
    transform: translate(-50%, -50%);
    animation: orbit-spin 6s linear infinite;
    animation-play-state: paused;
  }
  .orbit-btn:hover .orbit { animation-play-state: running; }
  .orbiter {
    position: absolute; left: 0; top: 0;
    transform: rotate(var(--a)) translateX(16px) rotate(calc(-1 * var(--a)));
  }
  .orbiter .glyph {
    display: block; margin: -7px 0 0 -7px;
    width: 14px; height: 14px;
    animation: orbit-counter 6s linear infinite;
    animation-play-state: paused;
  }
  .orbit-btn:hover .orbiter .glyph { animation-play-state: running; }
  .orbiter .material-symbols-outlined {
    font-size: 14px; color: var(--ink-dim);
    transition: color .2s ease;
  }
  .orbit-btn:hover .orbiter .material-symbols-outlined { color: var(--ink); }
  @keyframes orbit-spin {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to   { transform: translate(-50%, -50%) rotate(360deg); }
  }
  @keyframes orbit-counter {
    from { transform: rotate(0deg); }
    to   { transform: rotate(-360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .orbit, .orbiter .glyph, .brand-mark .ring, .mkt-dot { animation: none !important; }
    .orbit { transform: translate(-50%, -50%); }
  }

  /* ─────────────────────  faux dashboard underneath (context)  ───────────────────── */
  .stage { padding: 22px; display: flex; flex-direction: column; gap: 14px; opacity: 0.5; filter: blur(0.4px); }
  .stage-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .gc {
    height: 150px; border: 1px solid var(--rule); border-radius: 12px;
    background: linear-gradient(180deg, rgba(255,255,255,0.015), transparent 120px), rgba(18,18,20,0.5);
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .gc .accent { height: 2px; width: 64%; border-radius: 2px; background: linear-gradient(90deg, var(--positive), transparent); opacity: 0.5; }
  .gc .accent.neg { background: linear-gradient(90deg, var(--negative), transparent); }
  .gc .bar { height: 9px; border-radius: 3px; background: rgba(255,255,255,0.04); }
  .gc .bar.s { width: 42%; }
  .gc .bar.t { width: 24%; height: 7px; }
  .gc .spark { margin-top: auto; height: 38px; border-radius: 6px;
    background: radial-gradient(circle at 30% 70%, rgba(0,255,136,0.16), transparent 45%),
                radial-gradient(circle at 78% 35%, rgba(0,255,136,0.1), transparent 42%); }

  @media (max-width: 920px) {
    .ticker, .mkt { display: none; }
    .nav-left { gap: 18px; }
    .tab-label { display: none; }
  }
</style>
<link id="gfont-Inter" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap">
</head>
<body style="font-family: Inter">

<header class="nav" data-screen-label="Navbar Header" role="banner" style="padding: 0px 24px">
  <!-- LEFT: brand + tabs -->
  <div class="nav-left">
    <div class="brand">
      <span class="brand-text">
        <h1 class="brand-name">Vantage</h1>
        <div class="brand-sub">Precision Ledger</div>
      </span>
    </div>

    <nav class="tabs" aria-label="Primary">
      <a class="tab active" href="#" aria-current="page">
        <span class="material-symbols-outlined">dashboard</span>
        <span class="tab-label">Terminal</span>
      </a>
      <a class="tab" href="#" data-accent="blue">
        <span class="material-symbols-outlined">public</span>
        <span class="tab-label">World</span>
      </a>
      <a class="tab" href="#" data-accent="orange">
        <span class="material-symbols-outlined">neurology</span>
        <span class="tab-label">Agent</span>
      </a>
    </nav>
  </div>

  <!-- CENTER: portfolio value -->
  <div class="ticker">
    <span class="ticker-val">$3,166</span>
    <span class="ticker-delta">
      <span class="pct">-15.33%</span>
      <span class="abs">-$573</span>
    </span>
  </div>

  <!-- RIGHT: unified status rail -->
  <div class="rail" style="border-radius: 7px">
    <!-- agent sweep -->
    <div class="rail-seg agent-cell" style="border-radius: 7px 0px 0px 7px; flex-direction: row; justify-content: flex-start">
      <button class="agent-btn" title="Start Stock Agent Deep Intelligence Sweep" aria-label="Run agent sweep">
        <span class="material-symbols-outlined">neurology</span>
      </button>
    </div>


    <!-- market status -->
    <div class="rail-seg mkt" style="border-radius: 7px 0px 0px 7px; border-width: 0px 0px 0px 1px; border-style: solid; border-color: rgb(29, 28, 29)">
      <div class="mkt-top">
        <span class="mkt-dot"></span>
        <span class="mkt-state">Open</span>
      </div>
      <span class="mkt-time" id="clock">Jun 3, 10:20:05</span>
    </div>


    <!-- broker -->
    <div class="rail-seg broker" title="E*Trade connected — click to reconnect" role="button" tabindex="0" style="border-radius: 7px 0px 0px 7px">
      <span class="broker-logo"><span class="material-symbols-outlined">bolt</span></span>
      <span class="broker-label">connected</span>
    </div>


    <!-- orbital settings / account button (preserved) -->
    <div class="orbit-btn" title="Settings &amp; account" role="button" tabindex="0" aria-label="Settings and account" style="border-radius: 7px 0px 0px 7px">
      <div class="orbit-stage">
        <div class="orbit-ring"></div>
        <div class="orbit">
          <div class="orbiter" style="--a: -90deg;">
            <span class="glyph"><span class="material-symbols-outlined">settings</span></span>
          </div>
          <div class="orbiter" style="--a: 30deg;">
            <span class="glyph"><span class="material-symbols-outlined">person</span></span>
          </div>
          <div class="orbiter" style="--a: 150deg;">
            <span class="glyph"><span class="material-symbols-outlined">tune</span></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- dim faux dashboard for context -->
<main class="stage" aria-hidden="true">
  <div class="stage-grid">
    <div class="gc"><span class="accent"></span><span class="bar s"></span><span class="bar t"></span><span class="spark"></span></div>
    <div class="gc"><span class="accent neg"></span><span class="bar s"></span><span class="bar t"></span><span class="spark" style="background:radial-gradient(circle at 70% 60%, rgba(255,68,68,0.14), transparent 45%);"></span></div>
    <div class="gc"><span class="accent"></span><span class="bar s"></span><span class="bar t"></span><span class="spark"></span></div>
    <div class="gc"><span class="accent"></span><span class="bar s"></span><span class="bar t"></span><span class="spark"></span></div>
  </div>
  <div class="stage-grid">
    <div class="gc"><span class="accent neg"></span><span class="bar s"></span><span class="bar t"></span><span class="spark" style="background:radial-gradient(circle at 70% 60%, rgba(255,68,68,0.14), transparent 45%);"></span></div>
    <div class="gc"><span class="accent"></span><span class="bar s"></span><span class="bar t"></span><span class="spark"></span></div>
    <div class="gc"><span class="accent"></span><span class="bar s"></span><span class="bar t"></span><span class="spark"></span></div>
    <div class="gc"><span class="accent neg"></span><span class="bar s"></span><span class="bar t"></span><span class="spark" style="background:radial-gradient(circle at 70% 60%, rgba(255,68,68,0.14), transparent 45%);"></span></div>
  </div>
</main>

<script>
  // Tab switching — each tab carries its own accent color
  (function () {
    const tabs = document.querySelectorAll('.tabs .tab');
    tabs.forEach((t) => t.addEventListener('click', (e) => {
      e.preventDefault();
      tabs.forEach((o) => { o.classList.remove('active'); o.removeAttribute('aria-current'); });
      t.classList.add('active');
      t.setAttribute('aria-current', 'page');
    }));
  })();

  // Live clock to make the market-status block feel alive
  (function () {
    const el = document.getElementById('clock');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function tick() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, '0');
      el.textContent = `${months[d.getMonth()]} ${d.getDate()}, ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>

</body>
</html>
